version: "3.8"

services:

  postgres-dev:
    image: postgres:15
    container_name: gym_crm_postgres_dev
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: gym_crm_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_pass
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  postgres-stg:
    image: postgres:15
    container_name: gym_crm_postgres_stg
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: gym_crm_stg
      POSTGRES_USER: stg_user
      POSTGRES_PASSWORD: stg_pass
    volumes:
      - pgdata_stg:/var/lib/postgresql/data

  postgres-prod:
    image: postgres:15
    container_name: gym_crm_postgres_prod
    restart: always
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: gym_crm_prod
      POSTGRES_USER: prod_user
      POSTGRES_PASSWORD: prod_pass
    volumes:
      - pgdata_prod:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: gym_crm_pgadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gym.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres-dev
      - postgres-stg
      - postgres-prod

volumes:
  pgdata_dev:
  pgdata_stg:
  pgdata_prod:
